<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Configuração - Football Tactics Lab</title>
</head>
<body>
    <h1>Football Tactics Lab</h1>
    <h2>Configuração da atividade</h2>

    <label for="tema">Tema tático:</label>
    <select id="tema" name="tema">
        <option value="ataque">Ataque</option>
        <option value="defesa">Defesa</option>
        <option value="transicao">Transição</option>
    </select>

    <br><br>

    <label for="dificuldade">Dificuldade:</label>
    <select id="dificuldade" name="dificuldade">
        <option value="facil">Fácil</option>
        <option value="medio">Médio</option>
        <option value="dificil">Difícil</option>
    </select>

    <br><br>

    <label for="num_cenarios">Número de cenários:</label>
    <input type="number" id="num_cenarios" name="num_cenarios"
           min="1" max="20" value="5">

    <br><br>

    <label for="tempo_limite">Tempo limite (minutos):</label>
    <input type="number" id="tempo_limite" name="tempo_limite"
           min="1" max="60" value="15">
</body>
</html>
